# GPU use requires an explicit owner decision; external inference is the project default.
allowGpu: false
---
# Demo variant (see README / alternatives/):
#   lemonade | coffee | cafe | mate | piscola | cafept | cachaca
variant: lemonade

# Namespace (created by scripts/deploy.sh; set create: true only for manual helm installs)
namespace:
  create: false
  name: ""

# Helm release name (auto: same as namespace)
releaseName: ""

# Main application (name is derived from variant unless overridden)
app:
  name: ""  # auto from variant
  publicRoute: false
  maxConcurrentRequests: 1
  maxOutputTokens: 128
  maxRetries: 0
  upstreamStreaming: true
  image: quay.io/ckavili/lemon-fastapi@sha256:a62dc3333a0dc5890498b23991538ccda9517c4a591ba1c762f8ae962748fd1c

# LLM configuration
# In-cluster llama-32 uses KServe Service port 80. Override for BYO/MaaS.
model: {}
  # name: my-model
  # endpoint: my-maas-instance
  # port: 443
  # api_key: my-api-key

# Detector configuration
# Configure GPU usage and resources for each detector
detectors:
  # IBM HAP Detector (Granite Guardian)
  hap:
    useGpu: false
    resources:
      requests:
        cpu: '1'
        memory: 4Gi
      limits:
        cpu: '2'
        memory: 8Gi

  # Prompt Injection Detector (DeBERTa v3)
  promptInjection:
    useGpu: false
    resources:
      requests:
        cpu: '4'
        memory: 16Gi
      limits:
        cpu: '8'
        memory: 24Gi

# Enable openshift dashboard
metrics:
  dashboard:
    enabled: false # requires cluster-admin privileges to install the dashboard
    odc: false

# Shiny Dashboard configuration
shinyDashboard:
  image:
    repository: quay.io/sara_banderby/shinydashboard
    tag: fedora
    digest: sha256:6a0106c1173b9c91fad773dff06a21f9366094a4f846edb9643cb89290256242
    pullPolicy: Always
  replicas: 1
  service:
    port: 3838
    targetPort: 3838
  route:
    enabled: true
    host: ""  # Leave empty for auto-generated hostname
  metrics:
    url: ""  # auto: http://<app-name>:8080/metrics
    refreshInterval: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Supply the detector storage credentials at runtime.
modelStorage:
  existingSecret: ""

# Keep operator-generated Routes unreachable during functional validation.
networkPolicy:
  internalOnly: true

# Authenticated operator entry points; independent of the original direct Routes.
operatorAccess:
  enabled: false
  image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:d6623e38c4d8cb9fd3591ca04b842a1453a011fe99bb18105da5bf8a819e387b

# Controlled campaigns and the time-limited public audience gateway.
demoControl:
  enabled: false
  storageSize: 1Gi
  operatorUrl: ""
  audienceUrl: ""
