{{- $ns := include "assistant.namespace" . }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  namespace: {{ $ns }}
  name: fms-orchestr8-config-nlp
  annotations:
    helm.sh/weight: "0"
data:
  config.yaml: |
    chunkers:
      sentence:
        type: sentence
        service:
            hostname: chunker-service
            port: 8085
    openai: 
      service:
        hostname: {{ if .Values.demoControl.enabled }}lemonade-provider-budget.{{ $ns }}.svc{{ else }}{{ .Values.model.endpoint | default "llama-32-predictor" }}{{ end }}
        port: {{ if .Values.demoControl.enabled }}8443{{ else }}{{ .Values.model.port | default "80" }}{{ end }}
        api_token: MODEL_API_KEY
        request_timeout: 60
        {{- if or .Values.demoControl.enabled (eq (int (.Values.model.port | default 80)) 443) }}
        tls:
          # FMS requires cert_path even when no client key is used.
          cert_path: {{ if .Values.demoControl.enabled }}/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt{{ else }}/etc/pki/tls/certs/ca-bundle.crt{{ end }}
          client_ca_cert_path: {{ if .Values.demoControl.enabled }}/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt{{ else }}/etc/pki/tls/certs/ca-bundle.crt{{ end }}
          insecure: false
        {{- end }}
    detectors:
      regex_competitor:
        type: text_contents
        service:
            hostname: "127.0.0.1"
            port: 8080
        chunker_id: sentence
        default_threshold: 0.5
      hap:
        type: text_contents
        service:
          hostname: guardrails-detector-ibm-hap-predictor
          port: 80
        chunker_id: sentence
        default_threshold: 0.5
      prompt_injection:
        type: text_contents
        service:
          hostname: prompt-injection-detector-predictor
          port: 80
        chunker_id: sentence
        default_threshold: 0.5
      language_detection:
        type: text_contents
        service:
          hostname: lingua-detector
          port: 8080
        chunker_id: sentence
        default_threshold: 0.88
