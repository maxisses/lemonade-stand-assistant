{{- $ns := include "assistant.namespace" . }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  namespace: {{ $ns }}
  name: guardrails-detector-runtime-hap
  annotations:
    helm.sh/weight: "0"
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: '8080'
  containers:
    - args:
        - '--workers'
        - {{ .Values.detectors.hap.workers | default 4 | quote }}
        - '--host'
        - 0.0.0.0
        - '--port'
        - '8000'
        - '--log-config'
        - /common/log_conf.yaml
      command:
        - uvicorn
        - 'app:app'
      env:
        - name: MODEL_DIR
          value: /mnt/models
        - name: HF_HOME
          value: /tmp/hf_home
      image: quay.io/trustyai/guardrails-detector-huggingface-runtime@sha256:3d052b86f8c857d62a26b9827900bbf922c6e584af8f83ae3c0dd83f17b74f43
      name: kserve-container
      ports:
        - containerPort: 8000
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: guardrails-detector-huggingface
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  namespace: {{ $ns }}
  annotations:
    helm.sh/weight: "1"
    openshift.io/display-name: guardrails-detector-ibm-hap
    serving.kserve.io/deploymentMode: RawDeployment
  name: guardrails-detector-ibm-hap
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: guardrails-detector-huggingface
      name: ''
      resources:
        limits:
          cpu: {{ .Values.detectors.hap.resources.limits.cpu | quote }}
          memory: {{ .Values.detectors.hap.resources.limits.memory }}
          {{- if .Values.detectors.hap.useGpu }}
          nvidia.com/gpu: '1'
          {{- end }}
        requests:
          cpu: {{ .Values.detectors.hap.resources.requests.cpu | quote }}
          memory: {{ .Values.detectors.hap.resources.requests.memory }}
          {{- if .Values.detectors.hap.useGpu }}
          nvidia.com/gpu: '1'
          {{- end }}
      runtime: guardrails-detector-runtime-hap
      storage:
        key: {{ .Values.modelStorage.existingSecret | default "minio-data-connection-detector-models" | quote }}
        path: granite-guardian-hap-125m
    {{- if .Values.detectors.hap.useGpu }}
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    {{- end }}
