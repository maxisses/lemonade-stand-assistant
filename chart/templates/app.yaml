{{- $app := include "assistant.appName" . }}
{{- $files := include "assistant.filesPath" . }}
{{- $ns := include "assistant.namespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app }}-system-prompt
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: config
    demo-variant: {{ include "assistant.variant" . }}
data:
  prompt: |
{{ .Files.Get (printf "%s/system-prompt.txt" $files) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app }}-app-files
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
data:
  app_fastapi.py: |
{{ .Files.Get (printf "%s/app_fastapi.py" $files) | indent 4 }}
  index.html: |
{{ .Files.Get (printf "%s/index.html" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $app }}
  template:
    metadata:
      labels:
        app: {{ $app }}
        app.kubernetes.io/name: {{ $app }}
        demo-variant: {{ include "assistant.variant" . }}
    spec:
      containers:
        - name: {{ $app }}
          image: {{ .Values.app.image | default "quay.io/ckavili/lemon-fastapi:1.0.26" }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args: ["app_fastapi:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: MAX_CONCURRENT_REQUESTS
              value: {{ .Values.app.maxConcurrentRequests | default 1 | quote }}
            - name: MAX_OUTPUT_TOKENS
              value: {{ .Values.app.maxOutputTokens | default 128 | quote }}
            - name: MAX_RETRIES
              value: {{ .Values.app.maxRetries | default 0 | quote }}
            - name: ORCHESTRATOR_CA_FILE
              value: /etc/service-ca/service-ca.crt
            - name: DEMO_VARIANT
              value: {{ include "assistant.variant" . | quote }}
            - name: GUARDRAILS_ORCHESTRATOR_SERVICE_SERVICE_HOST
              value: "guardrails-orchestrator-service.{{ $ns }}.svc"
            - name: GUARDRAILS_ORCHESTRATOR_SERVICE_SERVICE_PORT
              value: "8032"
            - name: VLLM_MODEL
              value: {{ .Values.model.name | default "llama32" }}
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.existingSecret | default (printf "%s-secrets" $app) }}
                  key: vllm-api-key
                  optional: false
          volumeMounts:
            - name: service-ca
              mountPath: /etc/service-ca
              readOnly: true
            - name: system-prompt
              mountPath: /system-prompt
              readOnly: true
            - name: app-files
              mountPath: /application/app_fastapi.py
              subPath: app_fastapi.py
              readOnly: true
            - name: app-files
              mountPath: /application/static/index.html
              subPath: index.html
              readOnly: true
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: service-ca
          configMap:
            name: lemonade-service-ca
        - name: system-prompt
          configMap:
            name: {{ $app }}-system-prompt
            items:
              - key: prompt
                path: prompt
        - name: app-files
          configMap:
            name: {{ $app }}-app-files
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
spec:
  selector:
    app: {{ $app }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
---
{{- if .Values.app.publicRoute }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
  annotations:
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: 'true'
    haproxy.router.openshift.io/rate-limit-connections: 'false'
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/timeout-tunnel: 300s
spec:
  to:
    kind: Service
    name: {{ $app }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
---
{{- if not .Values.model.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}-secrets
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: config
    demo-variant: {{ include "assistant.variant" . }}
type: Opaque
stringData:
  vllm-api-key: {{ .Values.model.api_key | default "fake" | quote }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: monitoring
    demo-variant: {{ include "assistant.variant" . }}
spec:
  selector:
    matchLabels:
      app: {{ $app }}
  endpoints:
    - port: http
      path: /metrics
      interval: 3s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lemonade-service-ca
  namespace: {{ $ns }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data: {}
