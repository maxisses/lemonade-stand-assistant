{{- $app := include "assistant.appName" . }}
{{- $files := include "assistant.filesPath" . }}
{{- $ns := include "assistant.namespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app }}-system-prompt
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: config
    demo-variant: {{ include "assistant.variant" . }}
data:
  prompt: |
{{ .Files.Get (printf "%s/system-prompt.txt" $files) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app }}-app-files
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
data:
  app_fastapi.py: |
{{ .Files.Get (printf "%s/app_fastapi.py" $files) | indent 4 }}
  index.html: |
{{ .Files.Get (printf "%s/index.html" $files) | indent 4 }}
{{- if .Values.demoControl.enabled }}
{{- range $name := list "campaigns.py" "demo_control.py" "control.html" "audience.html" "audience-qr.svg" }}
  {{ $name }}: |
{{ $.Files.Get (printf "%s/%s" $files $name) | indent 4 }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $app }}
  template:
    metadata:
      annotations:
        checksum/application: {{ .Files.Get (printf "%s/app_fastapi.py" $files) | sha256sum | quote }}
        checksum/ui: {{ .Files.Get (printf "%s/index.html" $files) | sha256sum | quote }}
        {{- if .Values.demoControl.enabled }}
        checksum/control: {{ printf "%s%s%s%s" (.Files.Get (printf "%s/demo_control.py" $files)) (.Files.Get (printf "%s/campaigns.py" $files)) (.Files.Get (printf "%s/control.html" $files)) (.Files.Get (printf "%s/audience.html" $files)) | sha256sum | quote }}
        {{- end }}
        checksum/prompt: {{ .Files.Get (printf "%s/system-prompt.txt" $files) | sha256sum | quote }}
      labels:
        app: {{ $app }}
        app.kubernetes.io/name: {{ $app }}
        demo-variant: {{ include "assistant.variant" . }}
    spec:
      containers:
        - name: {{ $app }}
          image: {{ .Values.app.image | default "quay.io/ckavili/lemon-fastapi:1.0.26" }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args: ["app_fastapi:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            {{- if .Values.demoControl.enabled }}
            - name: DEMO_CONTROL_ENABLED
              value: "true"
            - name: DEMO_DATA_DIR
              value: /data
            - name: DEMO_SESSION_SECRET
              valueFrom:
                secretKeyRef: {name: lemonade-control, key: session-secret}
            - name: AUDIENCE_GATEWAY_KEY
              valueFrom:
                secretKeyRef: {name: lemonade-control, key: gateway-key}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef: {name: lemonade-model, key: vllm-api-key}
            - name: PROVIDER_BUDGET_URL
              value: https://lemonade-provider-budget.{{ $ns }}.svc:8443
            - name: OPERATOR_URL
              value: {{ .Values.demoControl.operatorUrl | quote }}
            - name: AUDIENCE_URL
              value: {{ .Values.demoControl.audienceUrl | quote }}
            - name: POLICY_CONFIG_HASH
              value: {{ printf "%s%s" (include (print $.Template.BasePath "/fms-orchestr8-config-nlp.yaml") .) (.Values.detectors | toJson) | sha256sum | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: MAX_CONCURRENT_REQUESTS
              value: {{ .Values.app.maxConcurrentRequests | default 1 | quote }}
            - name: MAX_OUTPUT_TOKENS
              value: {{ .Values.app.maxOutputTokens | default 128 | quote }}
            - name: MAX_RETRIES
              value: {{ .Values.app.maxRetries | default 0 | quote }}
            - name: ORCHESTRATOR_CA_FILE
              value: /etc/service-ca/service-ca.crt
            - name: DEMO_VARIANT
              value: {{ include "assistant.variant" . | quote }}
            - name: GUARDRAILS_ORCHESTRATOR_SERVICE_SERVICE_HOST
              value: "guardrails-orchestrator-service.{{ $ns }}.svc"
            - name: GUARDRAILS_ORCHESTRATOR_SERVICE_SERVICE_PORT
              value: "8032"
            - name: VLLM_MODEL
              value: {{ .Values.model.name | default "llama32" }}
            - name: MODEL_CHAT_TEMPLATE_KWARGS
              value: {{ .Values.model.chatTemplateKwargs | default dict | toJson | quote }}
            - name: ORCHESTRATOR_STREAMING
              value: {{ .Values.app.upstreamStreaming | quote }}
          volumeMounts:
            {{- if .Values.demoControl.enabled }}
            - name: state
              mountPath: /data
            {{- range $name := list "campaigns.py" "demo_control.py" }}
            - name: app-files
              mountPath: /application/{{ $name }}
              subPath: {{ $name }}
              readOnly: true
            {{- end }}
            {{- range $name := list "control.html" "audience.html" "audience-qr.svg" }}
            - name: app-files
              mountPath: /application/static/{{ $name }}
              subPath: {{ $name }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: service-ca
              mountPath: /etc/service-ca
              readOnly: true
            - name: system-prompt
              mountPath: /system-prompt
              readOnly: true
            - name: app-files
              mountPath: /application/app_fastapi.py
              subPath: app_fastapi.py
              readOnly: true
            - name: app-files
              mountPath: /application/static/index.html
              subPath: index.html
              readOnly: true
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        {{- if .Values.demoControl.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: lemonade-campaign-data
        {{- end }}
        - name: service-ca
          configMap:
            name: lemonade-service-ca
        - name: system-prompt
          configMap:
            name: {{ $app }}-system-prompt
            items:
              - key: prompt
                path: prompt
        - name: app-files
          configMap:
            name: {{ $app }}-app-files
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
spec:
  selector:
    app: {{ $app }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
---
{{- if .Values.app.publicRoute }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: frontend
    demo-variant: {{ include "assistant.variant" . }}
  annotations:
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: 'true'
    haproxy.router.openshift.io/rate-limit-connections: 'false'
    haproxy.router.openshift.io/timeout: 300s
    haproxy.router.openshift.io/timeout-tunnel: 300s
spec:
  to:
    kind: Service
    name: {{ $app }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
---
{{- if not .Values.model.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}-secrets
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: config
    demo-variant: {{ include "assistant.variant" . }}
type: Opaque
stringData:
  vllm-api-key: {{ .Values.model.api_key | default "fake" | quote }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: monitoring
    demo-variant: {{ include "assistant.variant" . }}
spec:
  selector:
    matchLabels:
      app: {{ $app }}
  endpoints:
    - port: http
      path: /metrics
      interval: 3s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lemonade-service-ca
  namespace: {{ $ns }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data: {}
