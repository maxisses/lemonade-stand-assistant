{{- $ns := include "assistant.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $ns }}
  name: chunker-service
  labels:
    app: chunker-service
    app.kubernetes.io/name: chunker-service
    app.kubernetes.io/component: chunker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chunker-service
  template:
    metadata:
      labels:
        app: chunker-service
    spec:
      containers:
      - name: chunker
        image: quay.io/rh-ee-mmisiura/chunkers@sha256:3037978e0f23c633cafc6bf226f6c269514677ff3cbb660c46a7b017c573afcd
        imagePullPolicy: Always
        ports:
        - containerPort: 8085
          name: grpc
          protocol: TCP
        resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $ns }}
  name: chunker-service
  labels:
    app: chunker-service
spec:
  selector:
    app: chunker-service
  ports:
  - port: 8085
    targetPort: 8085
    protocol: TCP
    name: grpc
  type: ClusterIP