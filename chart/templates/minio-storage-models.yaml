{{- $ns := include "assistant.namespace" . }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $ns }}
  name: minio-storage-guardrail-detectors
  annotations:
    helm.sh/weight: "-5"
spec:
  ports:
    - name: minio-client-port
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    app: minio-storage-guardrail-detectors
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ $ns }}
  name: minio-storage-guardrail-detectors-claim
  annotations:
    helm.sh/weight: "-5"
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $ns }}
  name: minio-storage-guardrail-detectors
  annotations:
    helm.sh/weight: "-4"
  labels:
    app: minio-storage-guardrail-detectors 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-storage-guardrail-detectors 
  template:
    metadata:
      labels:
        app: minio-storage-guardrail-detectors
        maistra.io/expose-route: 'true'
      name: minio-storage-guardrail-detectors
    spec:
      volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: minio-storage-guardrail-detectors-claim
      initContainers:
        - name: download-model
          image: quay.io/rgeada/llm_downloader@sha256:ee5f459370d481deebb7f866e74aece5aa85932f6428038a7ad6a672398b9f15
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              models=(
                ibm-granite/granite-guardian-hap-125m@a76ccfd3ddb790fa7c23db58149bfec7ba1aa57f
                protectai/deberta-v3-base-prompt-injection-v2@90c9989b1a342275dd0d1a95aad283c04e075671
              )
              echo "Starting download"
              mkdir -p /mnt/models/llms/
              for entry in "${models[@]}"; do
                model="${entry%@*}"
                revision="${entry##*@}"
                echo "Downloading $model"
                /tmp/venv/bin/huggingface-cli download "$model" --revision "$revision" --local-dir /mnt/models/huggingface/$(basename $model)
              done

              echo "Done!"
          resources:
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - mountPath: "/mnt/models/"
              name: model-volume
      containers:
        - args:
            - server
            - /models
          env:
            - name: MINIO_ACCESS_KEY
              {{- if .Values.modelStorage.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelStorage.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
              {{- else }}
              value: THEACCESSKEY
              {{- end }}
            - name: MINIO_SECRET_KEY
              {{- if .Values.modelStorage.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modelStorage.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
              {{- else }}
              value: THESECRETKEY
              {{- end }}
          image: quay.io/trustyai/modelmesh-minio-examples@sha256:65cb22335574b89af15d7409f62feffcc52cc0e870e9419d63586f37706321a5
          name: minio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: "/models/"
              name: model-volume
---
{{- if not .Values.modelStorage.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ $ns }}
  name: minio-data-connection-detector-models
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/managed: 'true'
  annotations:
    helm.sh/weight: "-5"
    opendatahub.io/connection-type: s3
    openshift.io/display-name: Minio Data Connection - Guardrail Detector Models
data: 
  AWS_ACCESS_KEY_ID: VEhFQUNDRVNTS0VZ
  AWS_DEFAULT_REGION: dXMtc291dGg= 
  AWS_S3_BUCKET: aHVnZ2luZ2ZhY2U=
  AWS_S3_ENDPOINT: aHR0cDovL21pbmlvLXN0b3JhZ2UtZ3VhcmRyYWlsLWRldGVjdG9yczo5MDAw 
  AWS_SECRET_ACCESS_KEY: VEhFU0VDUkVUS0VZ 
type: Opaque
{{- end }}
