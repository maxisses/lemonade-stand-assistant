{{- $ns := include "assistant.namespace" . }}
{{- $files := include "assistant.filesPath" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ $ns }}
  name: shiny-dashboard-app
  labels:
    app: shiny-dashboard
    app.kubernetes.io/name: shiny-dashboard
    app.kubernetes.io/component: dashboard
    demo-variant: {{ include "assistant.variant" . }}
data:
  app.R: |
{{ .Files.Get (printf "%s/shiny-app.R" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ $ns }}
  name: shiny-dashboard
  labels:
    app: shiny-dashboard
    app.kubernetes.io/name: shiny-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.shinyDashboard.replicas }}
  selector:
    matchLabels:
      app: shiny-dashboard
  template:
    metadata:
      labels:
        app: shiny-dashboard
        app.kubernetes.io/name: shiny-dashboard
    spec:
      containers:
      - name: shiny
        image: "{{ .Values.shinyDashboard.image.repository }}{{ if .Values.shinyDashboard.image.digest }}@{{ .Values.shinyDashboard.image.digest }}{{ else }}:{{ .Values.shinyDashboard.image.tag }}{{ end }}"
        imagePullPolicy: {{ .Values.shinyDashboard.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.shinyDashboard.service.targetPort }}
          name: http
          protocol: TCP
        env:
        - name: METRICS_URL
          value: {{ .Values.shinyDashboard.metrics.url | default (printf "http://%s:8080/metrics" (include "assistant.appName" .)) | quote }}
        - name: REFRESH_INTERVAL
          value: {{ .Values.shinyDashboard.metrics.refreshInterval | quote }}
        volumeMounts:
        - name: shiny-app
          mountPath: /srv/shiny-server/app.R
          subPath: app.R
          readOnly: true
        resources:
          {{- toYaml .Values.shinyDashboard.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.shinyDashboard.service.targetPort }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.shinyDashboard.service.targetPort }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: shiny-app
        configMap:
          name: shiny-dashboard-app
          defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $ns }}
  name: shiny-dashboard
  labels:
    app: shiny-dashboard
    app.kubernetes.io/name: shiny-dashboard
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app: shiny-dashboard
  ports:
  - port: {{ .Values.shinyDashboard.service.port }}
    targetPort: {{ .Values.shinyDashboard.service.targetPort }}
    protocol: TCP
    name: http
  type: ClusterIP
---
{{- if .Values.shinyDashboard.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  namespace: {{ $ns }}
  name: shiny-dashboard
  labels:
    app: shiny-dashboard
    app.kubernetes.io/name: shiny-dashboard
    app.kubernetes.io/component: dashboard
spec:
  {{- if .Values.shinyDashboard.route.host }}
  host: {{ .Values.shinyDashboard.route.host }}
  {{- end }}
  to:
    kind: Service
    name: shiny-dashboard
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
