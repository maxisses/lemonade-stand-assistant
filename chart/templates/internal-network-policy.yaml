{{- if .Values.networkPolicy.internalOnly }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lemonade-internal-only
  namespace: {{ include "assistant.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-monitoring
                  - openshift-user-workload-monitoring
                  - redhat-ods-applications
# The ingress-router namespace is deliberately excluded. Operator-created Routes
# cannot reach these pods; authenticated API port forwarding remains available.
{{- end }}
