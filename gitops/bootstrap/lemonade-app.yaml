# Sync manually after platform readiness and runtime secret creation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lemonade-demo
  namespace: openshift-gitops
spec:
  project: lemonade-demo
  source:
    repoURL: https://github.com/maxisses/lemonade-stand-assistant.git
    targetRevision: codex/lemonade-cpu-maas
    path: chart
    helm:
      releaseName: lemonade-demo
      valueFiles:
        - ../deploy/functional-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lemonade-demo
  ignoreDifferences:
    # The OpenShift service CA controller owns this one injected public certificate.
    - group: ""
      kind: ConfigMap
      name: lemonade-service-ca
      namespace: lemonade-demo
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
