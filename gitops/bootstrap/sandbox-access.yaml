# Apply with the verified project bootstrap before enabling the Helm extension.
apiVersion: v1
kind: Namespace
metadata:
  name: lemonade-sandbox
  labels:
    lemonade.openshift.io/component: agent-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lemonade-sandbox-broker, namespace: lemonade-sandbox}
rules:
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxwarmpools]
    resourceNames: [lemonade-python]
    verbs: [get]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lemonade-sandbox-broker, namespace: lemonade-sandbox}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: lemonade-sandbox-broker}
subjects:
  - {kind: ServiceAccount, name: lemonade-sandbox-broker, namespace: lemonade-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lemonade-gitops-sandbox, namespace: lemonade-sandbox}
rules:
  - apiGroups: [""]
    resources: [configmaps, resourcequotas, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxtemplates, sandboxwarmpools]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lemonade-gitops-sandbox, namespace: lemonade-sandbox}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: lemonade-gitops-sandbox}
subjects:
  - {kind: ServiceAccount, name: openshift-gitops-argocd-application-controller, namespace: openshift-gitops}
