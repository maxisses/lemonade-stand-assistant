# Initial integration only. Keep requests serial and outputs short.
variant: lemonade
namespace:
  # The platform Application owns the namespace.
  create: false
  name: lemonade-demo
model:
  name: qwen38-27b
  endpoint: maas-rhdp.apps.maas.redhatworkshops.io
  port: 443
  existingSecret: lemonade-model
  # Keep the small functional budget for final text, not hidden reasoning.
  chatTemplateKwargs:
    enable_thinking: false
app:
  maxConcurrentRequests: 1
  maxOutputTokens: 128
  maxRetries: 0
  upstreamStreaming: false
  publicRoute: false
detectors:
  hap:
    useGpu: false
    workers: 1
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  promptInjection:
    useGpu: false
    workers: 1
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
shinyDashboard:
  route:
    enabled: false

modelStorage:
  existingSecret: minio-data-connection-detector-models

# Keep operator-generated Routes unreachable during functional validation.
networkPolicy:
  internalOnly: true
